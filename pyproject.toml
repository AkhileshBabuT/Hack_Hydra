[project]
name = "hydramem"
version = "0.1.0"
description = "Bitemporal agent memory on HydraDB, with abstention as a first-class result."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "neo4j>=5.0",       # Bolt driver; HydraDB is Bolt 5.1-5.4 compatible
    "openai>=1.0",      # OpenAI-compatible client; NIM is the provider
    "pydantic>=2.0",    # strict schemas for extraction and answering
    "python-dotenv",    # .env, which is gitignored and holds the API key
    "tiktoken",         # pre-flight token counting for context routing
]

[project.optional-dependencies]
dev = ["pytest"]
# Slice 13's vector RAG baseline only. Kept out of the core install because it
# pulls torch (~2 GB) and nothing else in the project needs it -- `hydramem.vectors`
# imports it inside the function that loads the model, so the suite runs without it.
eval = ["sentence-transformers>=3.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
