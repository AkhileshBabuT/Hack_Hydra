# One-command HydraDB. `make up` wraps this.
#
# ponytail: the published image replaces the plan's build-from-source recipe
# (Rust 1.91 + libcypher-parser + GraphBLAS). That recipe does not work on
# Windows without WSL and was budgeted 8 hours of Day 1. This is ~40 seconds.
services:
  # LOCAL_PATH must already exist and the auth token must have content, so a
  # clean clone needs this before graph-node starts. Doing it here rather than
  # in a shell script keeps `docker compose up -d` sufficient on its own --
  # `make` is not present on a default Windows box.
  init:
    image: ghcr.io/hydra-db/hydradb:latest
    container_name: hydramem-init
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /data/store /data/cache
        [ -s /data/auth-token ] || printf '%s\n' 'local-development-token-32-bytes' > /data/auth-token
        chown -R 10001:10001 /data
    volumes:
      - ./hydradb-data:/data

  hydradb:
    image: ghcr.io/hydra-db/hydradb:latest
    container_name: hydramem-hydradb
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "7687:7687"   # Bolt
      - "8443:8443"   # HTTP
      - "9090:9090"   # admin / Prometheus metrics
    volumes:
      - ./hydradb-data:/data
    environment:
      CLOUD_PROVIDER: local
      LOCAL_PATH: /data/store
      GRAPH_NAMESPACE: default
      GRAPH_ID: default
      GRAPH_CELL_ID: cell-0
      GRAPH_CELLS: cell-0
      GRAPH_NODE_ID: node-0
      GRAPH_BOLT_NODE_ADDRESSES: node-0=127.0.0.1:7687
      GRAPH_ADVERTISED_BOLT_ADDR: 127.0.0.1:7687
      GRAPH_DATA_CACHE_DIR: /data/cache
      GRAPH_AUTH_TOKEN_FILE: /data/auth-token
      GRAPH_ALLOW_PLAINTEXT: "true"
      # Without this the node serves /readyz and then aborts on the first
      # query with a stack overflow. Not optional.
      RUST_MIN_STACK: "33554432"
    healthcheck:
      # bash, not CMD-SHELL: the image's /bin/sh is dash, which has no
      # /dev/tcp, so the shell form fails forever and the node reads
      # unhealthy while serving fine. bash is the only shell in the image.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9090"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes: {}
