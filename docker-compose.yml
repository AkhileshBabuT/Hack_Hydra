# One-command HydraDB. `make up` wraps this.
#
# ponytail: the published image replaces the plan's build-from-source recipe
# (Rust 1.91 + libcypher-parser + GraphBLAS). That recipe does not work on
# Windows without WSL and was budgeted 8 hours of Day 1. This is ~40 seconds.
services:
  hydradb:
    image: ghcr.io/hydra-db/hydradb:latest
    container_name: hydramem-hydradb
    ports:
      - "7687:7687"   # Bolt
      - "8443:8443"   # HTTP
      - "9090:9090"   # admin / Prometheus metrics
    volumes:
      - ./hydradb-data:/data
    environment:
      CLOUD_PROVIDER: local
      LOCAL_PATH: /data/store
      GRAPH_NAMESPACE: default
      GRAPH_ID: default
      GRAPH_CELL_ID: cell-0
      GRAPH_CELLS: cell-0
      GRAPH_NODE_ID: node-0
      GRAPH_BOLT_NODE_ADDRESSES: node-0=127.0.0.1:7687
      GRAPH_ADVERTISED_BOLT_ADDR: 127.0.0.1:7687
      GRAPH_DATA_CACHE_DIR: /data/cache
      GRAPH_AUTH_TOKEN_FILE: /data/auth-token
      GRAPH_ALLOW_PLAINTEXT: "true"
      # Without this the node serves /readyz and then aborts on the first
      # query with a stack overflow. Not optional.
      RUST_MIN_STACK: "33554432"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9090 && echo -e 'GET /metrics HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes: {}
